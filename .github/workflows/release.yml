# 推 v* tag 自动创建 GitHub Release，说明自动取自 CHANGELOG.md 对应版本段落。
# 前置：仓库 Secrets 配置 TRAFFIC_TOKEN，用于 Traffic API 与 Gist；Release 使用 GITHUB_TOKEN。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Extract changelog for the tagged version
        run: node .github/scripts/extract-changelog.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
      - name: Build release asset
        run: npm pack --ignore-scripts --pack-destination .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "dsh-workspace-mover-*.tgz"
      - name: Update release download metric
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node .github/scripts/release-downloads.mjs
