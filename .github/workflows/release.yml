# 推 v* tag 自动创建 GitHub Release，说明自动取自 CHANGELOG.md 对应版本段落。
# 前置：仓库 Secrets 里配置 TRAFFIC_TOKEN（classic PAT，repo 权限即可；GITHUB_TOKEN 也能建
# Release，但用同一 token 保持与 traffic-badge 的凭据策略一致）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Extract changelog for the tagged version
        run: node .github/scripts/extract-changelog.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
