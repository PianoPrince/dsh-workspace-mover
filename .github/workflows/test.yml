name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Use the macOS Intel pool while the ARM image pools await runner capacity.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check:syntax
      - name: Tests
        run: npm test
      - name: Pack dry-run
        run: npm run check:pack
