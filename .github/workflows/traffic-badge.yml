# Daily update of README clone / download badges (traffic API + Gist JSON).
# README is committed only if the Release downloads badge must appear or disappear.
# TRAFFIC_TOKEN is used only for GitHub Traffic API and Gist access.
name: Traffic badge

on:
  schedule:
    - cron: '20 18 * * *' # 18:20 UTC = 02:20 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node .github/scripts/traffic-badge.mjs
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      - run: node .github/scripts/release-downloads.mjs
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          PATCH_README: '1'
      - name: Push README badge visibility
        run: |
          git add README.md README_EN.md
          if git diff --cached --quiet; then
            echo 'README badge visibility unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync release downloads badge visibility'
          git push
